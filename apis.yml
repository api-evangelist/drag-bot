name: Drag Bot
description: >-
  drag&bot is a web-based industrial robotics software platform for the intuitive
  setup, programming, and operation of industrial robots without prior robotics or
  coding skills. Founded in Stuttgart in 2016 and acquired by KEBA in 2021, it lets
  production workers assemble robot programs by dragging and dropping reusable
  Function Blocks. The platform is built on ROS (Robot Operating System), making it
  vendor-neutral across robot brands such as KUKA, ABB, Universal Robots, FANUC,
  Denso, Kinova, and Aubo, as well as a wide range of grippers and peripheral tools.
  Developers extend the platform with Python/JSON Function Blocks and ROS-based
  Components (hardware drivers), and integrate with factory equipment over Modbus
  TCP/IP and MQTT. drag&bot has been integrated into KEBA's Kemro X automation
  platform. Its programmatic surface is exposed as ROS services, topics, and
  messages rather than a public REST/HTTP API.
